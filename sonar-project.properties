# ==============================================================
# SonarCloud - authentification-service
# ==============================================================

# -- Identification --------------------------------------------
sonar.projectKey=authentification-service
sonar.projectName=Authentification Service
sonar.projectVersion=0.0.1-SNAPSHOT

# -- Sources ---------------------------------------------------
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.sourceEncoding=UTF-8

# -- Couverture JaCoCo -----------------------------------------
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# -- Exclusions (entrypoint, entites, DTOs, seed BDD) ----------
sonar.exclusions=\
  **/AuthentificationServiceApplication.java,\
  **/model/**,\
  **/dto/**,\
  **/init/**

sonar.coverage.exclusions=\
  **/AuthentificationServiceApplication.java,\
  **/model/**,\
  **/dto/**,\
  **/init/**

# -- Quality Gate ----------------------------------------------
# Seuil enforce par JaCoCo dans le pom.xml (monte vers 0.80)
# SonarCloud = reporting uniquement (plan gratuit)
sonar.qualitygate.wait=false

# -- Connexion SonarCloud --------------------------------------
sonar.host.url=https://sonarcloud.io
sonar.organization=elhadj-cloud-lab
# sonar.token : passer via -Dsonar.token=... ou env SONAR_TOKEN
